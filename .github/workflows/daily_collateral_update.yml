name: Daily Collateral Update

on:
  schedule:
    - cron: "15 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-collateral:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run collateral monitoring
        run: |
          python main.py

      - name: Commit updated database and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add database/collateral.db reports/

          if git diff --cached --quiet; then
            echo "No database/report changes to commit."
          else
            git commit -m "Daily collateral update"
            git push
          fi
